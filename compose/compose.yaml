name: palworld-compose

services:
  palworld-server:
    container_name: Palworld-Server

    # https://github.com/pocketpairjp/palworld-dedicated-server-docker/pkgs/container/palserver
    image: ghcr.io/pocketpairjp/palserver:latest
    restart: unless-stopped

    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "Palworld-Server"

    environment:
      TZ: Asia/Taipei

    entrypoint: /pal/helper.sh

    # https://tech.palworldgame.com/settings-and-operation/arguments
    # Palworld Server Guide notes that on v1.0.0 or later, leaving the
    # multithread-related startup parameters unset may improve performance.
    command:
      - -port=8211
      - -players=32
      - -logformat=text

    ports:
      - "8211:8211/udp"

    volumes:
      - ../Data/helper.sh:/pal/helper.sh:ro
      - ../Data:/pal/Package/Pal/Saved

    stop_grace_period: 120s

    deploy:
      resources:
        reservations:
          cpus: "4"
          memory: 8G
        limits:
          cpus: "8"
          memory: 32G

  palworld-manager:
    build:
      context: https://github.com/io-software-ai/palserver-gui.git#main
      dockerfile: packages/agent/Dockerfile
    image: palserver/agent:latest
    container_name: Palworld-Manager
    restart: unless-stopped

    ports:
      - "10000:8250"

    environment:
      PALSERVER_DATA_DIR: /var/lib/palserver

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../GuiData:/var/lib/palserver
