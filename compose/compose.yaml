name: palworld-compose

services:
  palworld-server:
    profiles:
      - bootstrap
    container_name: Palworld-Server

    # Pocketpair's official image with the path adapter required by palserver-gui.
    image: palserver/pocketpair-manager:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    labels:
      app.palserver.instance: palworld-main

    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "Palworld-Server"

    environment:
      TZ: Asia/Taipei

    # https://tech.palworldgame.com/settings-and-operation/arguments
    # Palworld Server Guide notes that on v1.0.0 or later, leaving the
    # multithread-related startup parameters unset may improve performance.
    command:
      - -port=8211
      - -queryport=27015
      - -players=32
      - -logformat=text

    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"

    volumes:
      - ../Data/GuiData/instances/palworld-main/saved:/data/saved
      - ../Data/GuiData/instances/palworld-main/config:/data/config:ro

    stop_grace_period: 120s

    deploy:
      resources:
        reservations:
          cpus: "4"
          memory: 8G
        limits:
          cpus: "8"
          memory: 32G

  palworld-manager:
    build:
      context: https://github.com/io-software-ai/palserver-gui.git#main
      dockerfile: packages/agent/Dockerfile
    image: palserver/agent:latest
    container_name: Palworld-Manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:10000:8250"

    environment:
      # The agent passes instance paths to Docker Desktop through docker.sock.
      # This path therefore must be identical inside the agent and Docker's VM.
      PALSERVER_DATA_DIR: /run/desktop/mnt/host/e/Server/Palworld/Data/GuiData
      PALSERVER_REQUIRE_TOKEN: "1"
      PALSERVER_NO_OPEN: "1"
      PALSERVER_TELEMETRY: "0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - E:/Server/Palworld/Data/GuiData:/run/desktop/mnt/host/e/Server/Palworld/Data/GuiData

  # Build target only. The Manager uses this image when it creates a new
  # Docker-backed Palworld instance; it is never started by Compose.
  palworld-managed-image:
    profiles:
      - build-only
    build:
      context: ../manager-server
    image: palserver/pocketpair-manager:latest
